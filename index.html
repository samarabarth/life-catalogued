  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;max-width:300px;margin:0;\">A single, quiet place for your calendar, your travels, your memories, your money — and everything in between.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:14px;\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;\">\n      <input ref=\"{{ nameRef }}\" placeholder=\"Your name\" style=\"padding:14px 16px;border-radius:12px;border:1px solid oklch(0.9 0.014 70);background:oklch(0.995 0.006 75);font-size:14px;outline:none;\">\n      <input ref=\"{{ emailRef }}\" placeholder=\"you@gmail.com\" style=\"padding:14px 16px;border-radius:12px;border:1px solid oklch(0.9 0.014 70);background:oklch(0.995 0.006 75);font-size:14px;outline:none;\">\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ signInWithGoogle }}\" style=\"display:flex;align-items:center;justify-content:center;gap:10px;padding:15px;border-radius:999px;border:none;background:oklch(0.24 0.02 55);color:oklch(0.97 0.012 75);font-size:14px;font-weight:600;cursor:pointer;\">\n      <span style=\"width:18px;height:18px;border-radius:5px;background:conic-gradient(from 90deg, oklch(0.58 0.14 40), oklch(0.58 0.13 200), oklch(0.62 0.12 140), oklch(0.58 0.14 40));\"><\u002Fspan>\n      {{ googleButtonLabel }}\n    <\u002Fbutton>\n    <sc-if value=\"{{ hasGoogleAuthError }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:11px;color:oklch(0.5 0.14 40);text-align:center;line-height:1.5;\">{{ googleAuthErrorMsg }}<\u002Fdiv>\n    <\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ signIn }}\" style=\"background:none;border:none;color:oklch(0.55 0.02 55);font-size:12px;text-decoration:underline;cursor:pointer;padding:4px;\">Skip for now<\u002Fbutton>\n    <div style=\"font-size:11px;color:oklch(0.6 0.02 55);text-align:center;line-height:1.5;\">Google sign-in requests Calendar and Drive access and keeps your session refreshed automatically. Everything else saves locally under your account, on this device.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ signedIn }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n\n  <header style=\"display:flex;align-items:center;justify-content:space-between;padding:20px 20px 16px;border-bottom:1px solid oklch(0.9 0.014 70);position:sticky;top:0;background:oklch(0.97 0.012 75 / 0.96);backdrop-filter:blur(6px);z-index:20;\">\n    <button sc-camel-on-click=\"{{ openDrawer }}\" aria-label=\"Menu\" style=\"width:38px;height:38px;border-radius:10px;border:1px solid oklch(0.9 0.014 70);background:oklch(0.995 0.006 75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;\">\n      <span style=\"width:16px;height:1.5px;background:oklch(0.24 0.02 55);\"><\u002Fspan>\n      <span style=\"width:16px;height:1.5px;background:oklch(0.24 0.02 55);\"><\u002Fspan>\n      <span style=\"width:10px;height:1.5px;background:oklch(0.24 0.02 55);\"><\u002Fspan>\n    <\u002Fbutton>\n    <div style=\"font-family:'Newsreader',serif;font-style:italic;font-size:18px;\">{{ activeLabel }}<\u002Fdiv>\n    <sc-if value=\"{{ hasAvatar }}\" hint-placeholder-val=\"{{ false }}\">\n      <img ref=\"{{ avatarImgRef }}\" style=\"width:34px;height:34px;border-radius:50%;object-fit:cover;\">\n    <\u002Fsc-if>\n    <sc-if value=\"{{ noAvatar }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"width:34px;height:34px;border-radius:50%;background:oklch(0.58 0.14 40);color:oklch(0.99 0.006 40);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;\">{{ initials }}<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ hasGoogleAuthError }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 20px;background:oklch(0.58 0.14 40 / 0.12);border-bottom:1px solid oklch(0.58 0.14 40 / 0.25);\">\n      <div style=\"font-size:11.5px;color:oklch(0.4 0.1 40);\">Google session needs reconnecting.<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ reconnectGoogle }}\" style=\"padding:6px 12px;border-radius:8px;border:none;background:oklch(0.58 0.14 40);color:oklch(0.99 0.006 40);font-size:11px;font-weight:600;cursor:pointer;\">Reconnect<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <main style=\"padding:20px;padding-bottom:60px;min-height:750px;\">\n\n    <!-- HOME -->\n    <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-bottom:22px;\">\n        <div style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.58 0.14 40);margin-bottom:6px;\">{{ todayLong }}<\u002Fdiv>\n        <h2 style=\"font-family:'Newsreader',serif;font-size:26px;font-weight:500;margin:0;\">Good to see you, {{ firstName }}.<\u002Fh2>\n      <\u002Fdiv>\n\n      <div style=\"background:oklch(0.995 0.006 75);border:1px solid oklch(0.9 0.014 70);border-radius:16px;padding:18px;margin-bottom:14px;\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;\">\n          <span style=\"font-family:'Newsreader',serif;font-style:italic;font-size:16px;\">Today's schedule<\u002Fspan>\n          <a href=\"#\" sc-camel-on-click=\"{{ goCalendar }}\" style=\"font-size:11px;color:oklch(0.58 0.13 200);text-decoration:none;\">Open calendar →<\u002Fa>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasTodayEvents }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-for list=\"{{ todayEvents }}\" as=\"ev\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;gap:10px;padding:8px 0;border-top:1px solid oklch(0.93 0.012 75);\">\n              <div style=\"width:4px;border-radius:2px;background:{{ ev.color }};\"><\u002Fdiv>\n              <div>\n                <div style=\"font-size:13px;font-weight:500;\">{{ ev.title }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:oklch(0.5 0.02 55);\">{{ ev.time }} · {{ ev.location }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noTodayEvents }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:12px;color:oklch(0.55 0.02 55);padding:6px 0;\">Nothing on the books — a clear day.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;\">\n        <div sc-camel-on-click=\"{{ goMood }}\" style=\"cursor:pointer;background:oklch(0.995 0.006 75);border:1px solid oklch(0.9 0.014 70);border-radius:16px;padding:16px;\">\n          <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:oklch(0.5 0.02 55);margin-bottom:8px;\">Mood, lately<\u002Fdiv>\n          <div style=\"display:flex;gap:5px;align-items:flex-end;\">\n            <sc-for list=\"{{ moodSparkline }}\" as=\"m\" hint-placeholder-count=\"7\">\n              <div style=\"width:8px;height:{{ m.h }}px;border-radius:3px;background:{{ m.color }};\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ goFinances }}\" style=\"cursor:pointer;background:oklch(0.995 0.006 75);border:1px solid oklch(0.9 0.014 70);border-radius:16px;padding:16px;\">\n          <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:oklch(0.5 0.02 55);margin-bottom:8px;\">This month's savings<\u002Fdiv>\n          <div style=\"font-family:'Newsreader',serif;font-size:22px;\">{{ savingsAmountDisplay }}<\u002Fdiv>\n          <div style=\"font-size:11px;color:oklch(0.58 0.14 40);\">{{ savingsRatePct }}% of income<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:oklch(0.24 0.02 55);color:oklch(0.97 0.012 75);border-radius:16px;padding:18px;margin-bottom:14px;\">\n        <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:oklch(0.8 0.02 55);margin-bottom:6px;\">Time Capsule<\u002Fdiv>\n        <sc-if value=\"{{ hasNextCapsule }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-family:'Newsreader',serif;font-size:17px;margin-bottom:4px;\">{{ nextCapsuleTitle }}<\u002Fdiv>\n          <div style=\"font-size:12px;color:oklch(0.75 0.02 55);\">Opens in {{ nextCapsuleDays }} days · {{ nextCapsuleDate }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noNextCapsule }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font-size:12px;color:oklch(0.75 0.02 55);\">No capsules sealed yet.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;\">\n        <div sc-camel-on-click=\"{{ goTickets }}\" style=\"cursor:pointer;background:oklch(0.995 0.006 75);border:1px solid oklch(0.9 0.014 70);border-radius:16px;padding:16px;\">\n          <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:oklch(0.5 0.02 55);margin-bottom:6px;\">Last ticket<\u002Fdiv>\n          <div style=\"font-family:'Newsreader',serif;font-size:15px;\">{{ lastTicketTitle }}<\u002Fdiv>\n          <div style=\"font-size:11px;color:oklch(0.5 0.02 55);\">{{ lastTicketMeta }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div sc-camel-on-click=\"{{ goMakeItHappen }}\" style=\"cursor:pointer;background:oklch(0.995 0.006 75);border:1px solid oklch(0.9 0.014 70);border-radius:16px;padding:16px;\">\n          <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:oklch(0.5 0.02 55);margin-bottom:6px;\">Cities this year<\u002Fdiv>\n          <div style=\"font-family:'Newsreader',serif;font-size:22px;\">{{ cityCount }}<\u002Fdiv>\n          <div style=\"font-size:11px;color:oklch(0.58 0.13 200);\">top: {{ topCity }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- CALENDAR -->\n    <sc-if value=\"{{ isCalendar }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;gap:6px;margin-bottom:12px;\">\n        <sc-for list=\"{{ calViews }}\" as=\"v\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ v.select }}\" style=\"flex:1;padding:9px 0;border-radius:10px;border:1px solid {{ v.border }};background:{{ v.bg }};color:{{ v.fg }};font-size:12px;font-weight:600;cursor:pointer;text-transform:capitalize;\">{{ v.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-bottom:14px;\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;\">\n          <sc-for list=\"{{ calendarLegend }}\" as=\"cl\" hint-placeholder-count=\"8\">\n            <div sc-camel-on-click=\"{{ cl.toggle }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;border:1px solid oklch(0.9 0.014 70);opacity:{{ cl.opacity }};\">\n              <div style=\"width:9px;height:9px;border-radius:3px;background:{{ cl.checkBg }};border:1.5px solid {{ cl.color }};\"><\u002Fdiv>\n              <div style=\"font-size:10.5px;\">{{ cl.name }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleAddEvent }}\" style=\"width:100%;padding:10px;border-radius:9px;border:1px dashed oklch(0.7 0.014 70);background:none;color:oklch(0.45 0.03 55);font-size:12.5px;cursor:pointer;\">+ Add event<\u002Fbutton>\n        <sc-if value=\"{{ showAddEvent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:oklch(0.995 0.006 75);border:1px solid oklch(0.9 0.014 70);border-radius:14px;padding:18px;margin-top:8px;\">\n            <input ref=\"{{ evTitleRef }}\" placeholder=\"Add title\" style=\"width:100%;padding:8px 2px;border:none;border-bottom:2px solid oklch(0.88 0.012 70);font-size:19px;font-family:'Newsreader',serif;outline:none;margin-bottom:16px;background:none;\">\n\n            <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:oklch(0.55 0.02 55);margin-bottom:6px;\">Date &amp; time<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:14px;\">\n              <input ref=\"{{ evDateRef }}\" type=\"date\" style=\"padding:9px;border-radius:9px;border:1px solid oklch(0.9 0.014 70);font-size:13px;\">\n              <div style=\"display:flex;align-items:center;gap:8px;\">\n                <input ref=\"{{ evTimeRef }}\" type=\"time\" style=\"flex:1;padding:9px;border-radius:9px;border:1px solid oklch(0.9 0.014 70);font-size:13px;\">\n                <div style=\"color:oklch(0.6 0.02 55);font-size:12px;\">–<\u002Fdiv>\n                <input ref=\"{{ evEndTimeRef }}\" type=\"time\" style=\"flex:1;padding:9px;border-radius:9px;border:1px solid oklch(0.9 0.014 70);font-size:13px;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:oklch(0.55 0.02 55);margin-bottom:6px;\">Repeat<\u002Fdiv>\n            <sc-raw-select value=\"{{ newEventRecurrence }}\" sc-camel-on-change=\"{{ setNewEventRecurrence }}\" style=\"width:100%;padding:9px;border-radius:9px;border:1px solid oklch(0.9 0.014 70);font-size:13px;background:oklch(0.995 0.006 75);margin-bottom:6px;\">\n              <option value=\"none\">Does not repeat<\u002Foption>\n              <option value=\"daily\">Daily<\u002Foption>\n              <option value=\"weekly\">Weekly<\u002Foption>\n              <option value=\"monthly\">Monthly<\u002Foption>\n              <option value=\"yearly\">Annually<\u002Foption>\n              <option value=\"custom\">Custom<\u002Foption>\n            <\u002Fsc-raw-select>\n            <sc-if value=\"{{ isCustomRecurrenceSaved }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:11px;color:oklch(0.58 0.13 200);margin-bottom:14px;\">{{ recurrenceLabel }}<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:oklch(0.55 0.02 55);margin-bottom:6px;\">Location<\u002Fdiv>\n            <input ref=\"{{ evLocationRef }}\" placeholder=\"Add location\" style=\"width:100%;padding:9px;border-radius:9px;border:1px solid oklch(0.9 0.014 70);font-size:13px;margin-bottom:14px;\">\n\n            <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:oklch(0.55 0.02 55);margin-bottom:6px;\">Description<\u002Fdiv>\n            <textarea ref=\"{{ evDescRef }}\" placeholder=\"Add description\" rows=\"2\" style=\"width:100%;padding:9px;border-radius:9px;border:1px solid oklch(0.9 0.014 70);font-size:13px;resize:vertical;margin-bottom:14px;\"><\u002Ftextarea>\n\n            <div style=\"font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:oklch(0.55 0.02 55);margin-bottom:8px;\">Calendar<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;\">\n              <sc-for list=\"{{ newEventCalendarSwatches }}\" as=\"sw\" hint-placeholder-count=\"8\">\n                <div sc-camel-on-click=\"{{ sw.select }}\" style=\"cursor:pointer;display:flex;align-items:center;gap:6px;\">\n                  <div style=\"width:18px;height:18px;border-radius:5px;background:{{ sw.color }};box-shadow:0 0 0 2px oklch(0.97 0.012 75), 0 0 0 4px transparent;outline:{{ sw.ring }};outline-offset:2px;\"><\u002Fdiv>\n                  <div style=\"font-size:11px;color:oklch(0.45 0.03 55);\">{{ sw.name }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:8px;\">\n              <sc-if value=\"{{ isEditingEvent }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ deleteEvent }}\" style=\"padding:11px 16px;border-radius:9px;border:1px solid oklch(0.58 0.14 40 / 0.4);background:none;color:oklch(0.58 0.14 40);font-size:13px;cursor:pointer;\">Delete<\u002Fbutton>\n              <\u002Fsc-if>\n              <button sc-cam \n  ['Sad','oklch(0.55 0.1 250)'],['Angry','oklch(0.55 0.16 25)']\n];\nfunction emotionColor(name){ const hit = EMOTIONS.find(([n])=>n===name); return hit ? hit[1] : 'oklch(0.7 0.02 55)'; }\nconst CALENDARS = [\n  {id:'amor', name:'Amor', color:'#d81b60'},\n  {id:'aniv1', name:'Aniversários', color:'#3949ab'},\n  {id:'beleza', name:'Beleza/Saúde', color:'#f4511e'},\n  {id:'sair', name:'Sair', color:'#43a047'},\n  {id:'tarefas', name:'Tarefas', color:'#1e88e5'},\n  {id:'trabalho', name:'Trabalho', color:'#fbc02d'},\n  {id:'unifebe', name:'UNIFEBE', color:'#8e24aa'}\n];\nconst BRUSQUE_HOLIDAYS = [\n  {date:'2026-01-01', name:'Confraternização Universal'},\n  {date:'2026-02-16', name:'Carnaval'},\n  {date:'2026-02-17', name:'Carnaval (ponto facultativo)'},\n  {date:'2026-04-03', name:'Paixão de Cristo'},\n  {date:'2026-04-21', name:'Tiradentes'},\n  {date:'2026-05-01', name:'Dia do Trabalho'},\n  {date:'2026-06-04', name:'Corpus Christi'},\n  {date:'2026-08-04', name:'Aniversário de Brusque'},\n  {date:'2026-09-07', name:'Independência do Brasil'},\n  {date:'2026-10-12', name:'Nossa Senhora Aparecida'},\n  {date:'2026-11-02', name:'Finados'},\n  {date:'2026-11-15', name:'Proclamação da República'},\n  {date:'2026-11-20', name:'Consciência Negra'},\n  {date:'2026-12-25', name:'Natal'}\n];\nfunction holidayFor(iso){ return BRUSQUE_HOLIDAYS.find(h=>h.date===iso); }\nfunction calColor(id){ const c = CALENDARS.find(c=>c.id===id); return c ? c.color : '#9e9e9e'; }\nfunction calName(id){ const c = CALENDARS.find(c=>c.id===id); return c ? c.name : 'Other'; }\nfunction expandOccurrences(ev, rangeStart, rangeEnd){\n  if(!ev.recurrence || ev.recurrence==='none') return [ev];\n  const [y,m,d] = ev.date.split('-').map(Number);\n  const startDate = new Date(y,m-1,d);\n  const endLimit = (ev.endMode==='on' && ev.endDate) ? new Date(ev.endDate+'T23:59:59') : null;\n  const maxCount = (ev.endMode==='after' && ev.endCount) ? ev.endCount : Infinity;\n\n  if(ev.recurrence==='custom' && ev.customUnit==='week' && ev.customWeekdays && ev.customWeekdays.length){\n    const sunStart = new Date(startDate); sunStart.setDate(sunStart.getDate()-sunStart.getDay());\n    const out = [];\n    let weekCursor = new Date(sunStart);\n    let occCount = 0, iterGuard = 0;\n    while(weekCursor <= rangeEnd && occCount < maxCount && iterGuard < 300){\n      for(const wd of ev.customWeekdays){\n        if(occCount >= maxCount) break;\n        const day = addDays(weekCursor, wd);\n        if(day < startDate || day < rangeStart || day > rangeEnd) continue;\n        if(endLimit && day > endLimit) continue;\n        out.push({...ev, date: toISO(day), id: ev.id+'-occ-'+toISO(day)});\n        occCount++;\n      }\n      weekCursor = addDays(weekCursor, 7*Math.max(1, ev.customInterval||1));\n      iterGuard++;\n    }\n    return out.sort((a,b)=>a.date.localeCompare(b.date));\n  }\n\n  let stepFn;\n  if(ev.recurrence==='custom'){\n    const n = Math.max(1, ev.customInterval||1);\n    const unit = ev.customUnit||'week';\n    stepFn = unit==='day'?(x=>addDays(x,n)): unit==='week'?(x=>addDays(x,7*n)): unit==='month'?(x=>addMonths(x,n)): (x=>addYears(x,n));\n  } else {\n    stepFn = ev.recurrence==='daily'?(x=>addDays(x,1)): ev.recurrence==='weekly'?(x=>addDays(x,7)): ev.recurrence==='monthly'?(x=>addMonths(x,1)): (x=>addYears(x,1));\n  }\n  const out = [];\n  let cur = new Date(startDate);\n  let count = 0, occCount2 = 0;\n  while(cur <= rangeEnd && count<400 && occCount2<maxCount){\n    if(endLimit && cur > endLimit) break;\n    if(cur >= rangeStart){ out.push({...ev, date: toISO(cur), id: ev.id+'-occ-'+toISO(cur)}); occCount2++; }\n    cur = stepFn(cur);\n    count++;\n  }\n  return out;\n}\nfunction from12hTo24(t12){\n  if(!t12) return '';\n  const m = t12.match(/(\\d+):(\\d+)\\s*(AM|PM)/i);\n  if(!m) return '';\n  let h = parseInt(m[1]); const min = m[2]; const period = m[3].toUpperCase();\n  if(period==='PM' && h!==12) h += 12;\n  if(period==='AM' && h===12) h = 0;\n  return
